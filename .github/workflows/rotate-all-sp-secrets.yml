name: Rotate SP secrets

on:
  schedule:
    - cron: '0 3 1 * *' # monthly, 03:00 UTC on the 1st
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only (no changes)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rotate all tagged secrets
        shell: pwsh
        run: |
          ./Rotate-AllSpSecrets.ps1 `
            -SubscriptionId '${{ secrets.AZURE_SUBSCRIPTION_ID }}' `
            -ValidityDays 90 `
            -RemoveOldSecrets `
            -WhatIf:$${{ inputs.dry_run == true }}
