name: Rotate SP secret

on:
  schedule:
    - cron: '0 3 1 * *' # monthly, 03:00 UTC on the 1st
  workflow_dispatch:
    inputs:
      remove_old_secrets:
        description: Delete older secrets after rotation
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rotate secret
        shell: pwsh
        run: |
          ./Rotate-SpSecret.ps1 `
            -AppId '${{ vars.TARGET_APP_ID }}' `
            -VaultName '${{ vars.KEY_VAULT_NAME }}' `
            -SecretName '${{ vars.KEY_VAULT_SECRET_NAME }}' `
            -ValidityDays 90 `
            -RemoveOldSecrets:$${{ github.event_name == 'schedule' || inputs.remove_old_secrets }}
